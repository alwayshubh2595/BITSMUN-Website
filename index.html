<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>SOD x BITSMUN 2026 | BITS Pilani Model United Nations</title>
    <meta
      name="description"
      content="SOD x BITSMUN 2026 — the Model United Nations conference at BITS Pilani, 4-6 September 2026. Eight committees, a prize pool of over INR 1,50,000, and delegates from across India and beyond."
    />
    <link rel="canonical" href="https://bitsmun.org/" />
    <meta name="theme-color" content="#0e1018" />

    <!-- Open Graph / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BITSMUN Pilani" />
    <meta property="og:title" content="SOD x BITSMUN 2026 | BITS Pilani Model United Nations" />
    <meta
      property="og:description"
      content="4-6 September 2026 at BITS Pilani. Eight committees, a prize pool of over INR 1,50,000. Debate. Discuss. Decide."
    />
    <meta property="og:url" content="https://bitsmun.org/" />
    <meta property="og:image" content="https://bitsmun.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SOD x BITSMUN 2026, 4-6 September, BITS Pilani" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SOD x BITSMUN 2026 | BITS Pilani Model United Nations" />
    <meta
      name="twitter:description"
      content="4-6 September 2026 at BITS Pilani. Eight committees, a prize pool of over INR 1,50,000. Debate. Discuss. Decide."
    />
    <meta name="twitter:image" content="https://bitsmun.org/og-image.png" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  </head>
  <body>
    <script>
      // Apply the stored theme before first paint so the page never flashes the
      // wrong one. Dark is the default; only an explicit "light" choice opts out.
      // Kept inline and dependency-free because it must run before the bundle.
      (function () {
        try {
          if (localStorage.getItem('bitsmun:theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {
          /* storage unavailable; fall through to the dark default */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
